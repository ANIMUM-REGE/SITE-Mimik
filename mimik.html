<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimik — You've been challenged</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         max-width: 26rem; margin: 0 auto; padding: 3rem 1.25rem; line-height: 1.6;
         background: #0a081a; color: #fff; text-align: center; }
  h1 { font-size: 1.8rem; color: #17d0e8; text-shadow: 0 0 18px rgba(23,208,232,.8); }
  .beat { color: #9eff47; font-size: 1.15rem; font-weight: 700; }
  .btn { display: block; margin: 1rem auto; padding: 1rem 1.5rem; border-radius: 16px;
         font-weight: 700; text-decoration: none; max-width: 20rem; }
  .open { background: #17d0e8; color: #000; box-shadow: 0 0 20px rgba(23,208,232,.5); }
  .store { border: 2px solid #ff38c7; color: #ff38c7; }
  footer { margin-top: 3rem; font-size: .8rem; opacity: .6; }
  footer a { color: #17d0e8; }
</style>
</head>
<body>
<h1>MIMIK</h1>
<p><strong>A friend challenged you.</strong><br>Make the face. Beat the score.</p>
<p class="beat" id="beat" hidden></p>
<a class="btn open" id="open" href="mimik://challenge">Open in Mimik</a>
<a class="btn store" href="https://apps.apple.com/app/id6789150543">Get Mimik on the App Store</a>
<p style="opacity:.7;font-size:.9rem">Your camera and your face stay on your phone —
challenge links carry only which face to make and the score to beat.</p>
<script>
  // Bounce the challenge into the app: mimik://challenge?<same query>.
  var q = location.search.replace(/^\?/, "");
  if (q) {
    document.getElementById("open").href = "mimik://challenge?" + q;
    var m = /(?:^|&)beat=(\d{1,9})(?:&|$)/.exec(q);
    if (m) {
      var el = document.getElementById("beat");
      el.textContent = "Score to beat: " + m[1];
      el.hidden = false;
    }
    location.href = "mimik://challenge?" + q; // auto-open when installed
  }
</script>
<footer><a href="index.html">Support</a> · <a href="privacy.html">Privacy</a><br>© 2026 Animum Rege LLC</footer>
</body>
</html>
